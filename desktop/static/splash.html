<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'self' file:; script-src 'self' file: 'unsafe-inline'">
  <title>TaskForce</title>
  <!-- L'écran de la coque (shell.css, panel.js) : à droite, ce qui fait attendre (démarrage, mise à jour, déconnexion)
       ou ce qui a échoué, et quoi faire. -->
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <script src="panel.js"></script>
  <main class="wait" id="wait">
    <svg class="logo" aria-hidden="true"><use href="#tf-mark"/></svg>
    <h1 id="step">Starting TaskForce</h1>
    <div class="bar" id="bar" role="progressbar" aria-label="Starting TaskForce"></div>
    <p class="note" id="note" hidden></p>
    <div class="actions" id="actions" hidden></div>
    <details id="more" hidden>
      <summary>Details</summary>
      <p class="detail" id="detail"></p>
    </details>
  </main>
  <script>
    // Ce que l'écran dit arrive par l'adresse, mise à jour par la coque : l'étape (#step=), une ligne qui dit ce qui se
    // passe (#note=) ; pour un échec, ses actions (#actions=, la dernière est la principale) et le détail brut
    // (#detail=), à un clic.
    const LABELS = { quit: "Quit", logs: "Open logs", retry: "Try again", signin: "Sign in" };
    const wait = document.getElementById("wait");
    function render() {
      const params = new URLSearchParams(location.hash.slice(1));
      const step = params.get("step") || "Starting TaskForce";
      const note = params.get("note");
      const actions = (params.get("actions") || "").split(",").filter((name) => name in LABELS);
      const detail = params.get("detail");
      document.getElementById("step").textContent = step;
      document.getElementById("bar").setAttribute("aria-label", step);
      const noteLine = document.getElementById("note");
      noteLine.hidden = !note;
      noteLine.textContent = note ?? "";
      wait.classList.toggle("failed", actions.length > 0);
      const row = document.getElementById("actions");
      row.replaceChildren(...actions.map((name, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = LABELS[name];
        if (index === actions.length - 1) button.className = "primary";
        button.addEventListener("click", () => {
          row.querySelectorAll("button").forEach((b) => (b.disabled = true));
          void window.taskforceScreen?.act(name).finally(() => row.querySelectorAll("button").forEach((b) => (b.disabled = false)));
        });
        return button;
      }));
      row.hidden = actions.length === 0;
      document.getElementById("more").hidden = !detail;
      document.getElementById("detail").textContent = detail ?? "";
      row.querySelector(".primary")?.focus();
    }
    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
