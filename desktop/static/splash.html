<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>TaskForce</title>
  <style>
    :root { color-scheme: light dark; --bg: #fbfbfc; --ink: #1c1b19; --muted: #6b6862; --line: #e6e6e9; --accent: #2f6bf6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1116; --ink: #ecebe8; --muted: #9a978f; --line: #262b33; } }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      display: grid; place-items: center; -webkit-app-region: drag; user-select: none; }
    main { display: grid; gap: 18px; justify-items: center; text-align: center; padding: 24px; }
    .name { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    .step { color: var(--muted); min-height: 21px; }
    .bar { width: 180px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); border-radius: 3px;
      animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: 0.5; } }
  </style>
</head>
<body>
  <main>
    <svg class="logo" width="56" height="56" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#2f6bf6"/><svg x="19" y="19" width="62" height="62" viewBox="180 79 250 250"><path fill-rule="evenodd" fill="#fff" d="M 295.302 130.180 C 288.367 131.232, 281.321 133.995, 275.687 137.871 C 270.921 141.151, 235.210 178.670, 233.593 182.096 C 231.969 185.539, 233.936 185.455, 240.778 181.788 C 244.475 179.807, 250.650 177.160, 254.500 175.906 C 261.252 173.706, 263.165 173.603, 308.500 173.007 C 358.807 172.345, 357.172 172.511, 368.097 166.959 C 373.525 164.200, 404 134.371, 404 131.817 C 404 130.817, 403.663 129.927, 403.250 129.837 C 400.447 129.230, 299.451 129.550, 295.302 130.180 M 268.500 185.116 C 260.296 186.308, 251.710 189.336, 245.826 193.111 C 240.552 196.496, 208 229.691, 208 231.685 C 208 234.229, 210.489 233.990, 224.753 230.080 C 232.864 227.857, 242.650 225.589, 246.500 225.039 C 250.350 224.489, 272.077 224.031, 294.782 224.020 C 348.983 223.994, 345.904 224.948, 368.630 201.140 C 375.433 194.012, 381 187.513, 381 186.697 C 381 185.881, 380.288 184.941, 379.418 184.607 C 376.966 183.666, 275.264 184.133, 268.500 185.116 M 245.798 237.923 C 242.661 238.930, 238.088 240.930, 235.635 242.368 C 231.238 244.945, 209.192 267.489, 205.744 272.935 C 202.511 278.042, 203.673 278.223, 236.710 277.771 C 269.622 277.321, 270.882 277.112, 280.500 270.516 C 286.603 266.331, 310.500 240.602, 310.500 238.216 C 310.500 236.638, 308.128 236.484, 281 236.296 C 254.795 236.115, 250.863 236.297, 245.798 237.923"/></svg></svg>
    <div class="name">TaskForce</div>
    <div class="bar" role="progressbar" aria-label="Starting"></div>
    <div class="step" id="step">Starting</div>
  </main>
  <script>
    // L'étape en cours arrive par l'adresse (#step=...), mise à jour par la coque.
    function render() {
      const step = new URLSearchParams(location.hash.slice(1)).get("step");
      if (step) document.getElementById("step").textContent = step;
    }
    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
