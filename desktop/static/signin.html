<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'self' file:; script-src 'self' file: 'unsafe-inline'">
  <title>Sign in to TaskForce</title>
  <!-- L'écran de la coque (shell.css, panel.js) : à droite, la connexion. -->
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <script src="panel.js"></script>
  <main>
    <div>
      <h1>Sign in to TaskForce</h1>
      <p class="lead">Use your free TaskForce account. Your browser opens to sign in, then you come back here.</p>
    </div>
    <div class="actions">
      <button class="primary" id="signin" type="button">Sign in</button>
      <button id="signup" type="button">Create an account</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="note">Your projects stay on this computer. TaskForce keeps your session so you don't have to sign in at each start.</p>
  </main>
  <script>
    const status = document.getElementById("status");
    const buttons = [document.getElementById("signin"), document.getElementById("signup")];
    async function start(signUp) {
      buttons.forEach((b) => (b.disabled = true));
      status.className = "status";
      status.textContent = "Continue in your browser. This window updates when you're done.";
      const result = signUp ? await window.taskforceSignIn.signUp() : await window.taskforceSignIn.signIn();
      if (!result.ok) {
        status.className = "status error";
        status.textContent = result.error || "Sign-in didn't finish. Try again.";
        buttons.forEach((b) => (b.disabled = false));
      } else {
        status.textContent = "Signed in. Opening TaskForce.";
      }
    }
    document.getElementById("signin").addEventListener("click", () => start(false));
    document.getElementById("signup").addEventListener("click", () => start(true));
  </script>
</body>
</html>
