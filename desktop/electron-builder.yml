# Paquets de l'app desktop (electron-builder). Les ressources (Java, base, backend, interface, runner) sont assemblées
# dans resources/ par `npm run resources` (en local) ou par la CI (.github/workflows/desktop-release.yml).
appId: fr.taskforce-project.desktop
productName: TaskForce
copyright: Copyright 2026 TaskForce contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - static/**
  - package.json
extraResources:
  # jre, backend, postgres, frontend et runner, copiés en une fois depuis leur dossier parent : electron-builder écarte
  # toujours le node_modules qui est à la racine de « from », et le serveur Next autonome ne trouverait plus le module
  # « next ». Son dossier .next commence par un point : il faut le nommer.
  - from: resources
    to: .
    filter:
      - "**/*"
      - "frontend/.next/**/*"
asar: true

win:
  target:
    - nsis
    - appx
  icon: build/icon.png
  artifactName: TaskForce-Setup-${version}.exe

# Installation par personne, sans droits d'administrateur, comme Claude Desktop : %LOCALAPPDATA%\Programs\TaskForce.
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: TaskForce
  # Après une désinstallation demandée par la personne, la page « merci » du site (installer.nsh).
  include: installer.nsh

# Version Microsoft Store : paquet AppX (le Partner Center le range avec les MSIX), téléversé à la main, jamais
# publié sur GitHub. Microsoft le signe à la publication : ni SmartScreen ni Smart App Control ne le bloquent.
# L'identité est celle que le Partner Center a réservée pour TaskForce (Product identity). Le Store installe les mises
# à jour (updater.ts) et les données vont dans le dossier du paquet (paths.ts, storeDataDir). Tuiles et logos :
# build/appx, dessinés par `npm run icon`.
appx:
  identityName: TaskForceProject.TaskForceProject
  publisher: CN=FCE16416-99B3-4A3B-B8BD-9B0C3D4A1EB9
  publisherDisplayName: TaskForce Project
  applicationId: TaskForce
  displayName: TaskForce
  backgroundColor: "#2f6bf6"
  # L'interface est en anglais.
  languages:
    - en-US
  # Windows 10 1809 au moins ; déclaré compatible jusqu'à Windows 11 24H2.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  artifactName: TaskForce-${version}-store.${ext}

linux:
  target:
    - deb
    - AppImage
  icon: build/icon.png
  category: Office
  synopsis: Projects, Brain OS and coding agents on your computer
  maintainer: TaskForce contributors <contact@taskforce-project.fr>
  # Dépendances du .deb : celles d'electron-builder par défaut (GTK, NSS, libsecret pour le trousseau, libuuid pour
  # la base embarquée) ; zlib, que la base lit aussi, est présente sur toute distribution.
  artifactName: TaskForce-${version}-${arch}.${ext}

# Mises à jour : release `desktop-latest` du dépôt, qui porte toujours la dernière version desktop (cf. updater.ts).
publish:
  provider: generic
  url: https://github.com/taskforce-project/taskforce-fullstack/releases/download/desktop-latest
