# ===============================
# APPLICATION PRINCIPALE
# Configuration commune à tous les environnements
# ===============================
spring:
  application:
    name: taskforce-api

  profiles:
    active: ${SPRING_PROFILE:dev}

  # JPA Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  # Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # Email Configuration
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

  web:
    error:
      include-message: always
      include-binding-errors: always
      include-stacktrace: on_param
      include-exception: false

  # Upload multipart : le défaut Spring (1 Mo) faisait échouer l'upload d'avatar en 500
  # (l'UI annonce « max 3 Mo »). Relevé à 10 Mo (avatars + pièces jointes). Un dépassement
  # renvoie désormais un 413 propre (GlobalExceptionHandler.handleMaxUploadSize).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# Server Configuration
server:
  port: ${SERVER_PORT:8080}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # Métriques (supervision / alertes E26) : histogramme pour le p95 de latence + tag applicatif.
  metrics:
    tags:
      application: taskforce-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

