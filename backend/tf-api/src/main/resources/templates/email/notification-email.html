<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification - TaskForce</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #fafafa;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e5e5e5;
        }

        .header {
            background: #171717;
            padding: 24px;
            text-align: center;
        }

        .brand {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .content { padding: 40px 32px; }

        .event-label {
            display: inline-block;
            color: #525252;
            background: #f5f5f5;
            border: 1px solid #e5e5e5;
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .greeting {
            color: #737373;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 22px;
            font-weight: 600;
            color: #0a0a0a;
            margin-bottom: 16px;
            line-height: 1.35;
        }

        .body-quote {
            color: #525252;
            background: #fafafa;
            border-left: 3px solid #e5e5e5;
            border-radius: 4px;
            padding: 12px 16px;
            margin: 20px 0;
            font-size: 15px;
        }

        .cta { text-align: center; margin: 32px 0 8px; }

        .cta a {
            display: inline-block;
            background: #171717;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
        }

        .footer {
            background: #fafafa;
            padding: 28px 24px;
            text-align: center;
            border-top: 1px solid #e5e5e5;
        }

        .footer-text { color: #a3a3a3; font-size: 13px; margin-bottom: 8px; }

        .footer-note { color: #a3a3a3; font-size: 12px; line-height: 1.5; }

        @media only screen and (max-width: 600px) {
            .content { padding: 32px 24px; }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <span class="brand">TaskForce</span>
        </div>

        <div class="content">
            <span class="event-label" th:text="${eventLabel}">Notification</span>

            <div class="greeting">Hi <span th:text="${recipientName}">there</span>,</div>

            <div class="title" th:text="${title}">Something happened on your work</div>

            <div class="body-quote" th:if="${body != null and !body.isEmpty()}" th:text="${body}">Details</div>

            <div class="cta">
                <a th:href="${actionUrl}" href="#">
                    View <span th:text="${issueIdentifier}">TF-1</span>
                </a>
            </div>
        </div>

        <div class="footer">
            <p class="footer-text">© 2026 TaskForce. All rights reserved.</p>
            <p class="footer-note">
                You are receiving this because email is enabled for this notification type.
                You can change this anytime in Settings → Notifications.
            </p>
        </div>
    </div>
</body>

</html>
