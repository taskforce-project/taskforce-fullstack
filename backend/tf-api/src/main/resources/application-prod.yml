# ===============================
# ENVIRONNEMENT PRODUCTION
# ===============================
spring:
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Production Settings
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  # Flyway Production
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

  # Redis (rate limiting distribué multi-instances — TF-SEC-011)
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM:taskforce}
          jwk-set-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM:taskforce}/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM:taskforce}
  web:
    error:
      include-stacktrace: never
      include-message: always

# Rate limiting distribué (buckets partagés via Redis entre instances) — TF-SEC-011
ratelimit:
  distributed:
    enabled: ${RATELIMIT_DISTRIBUTED_ENABLED:true}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Keycloak Configuration
keycloak:
  url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM:taskforce}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}

# Application URLs (OAuth callbacks, liens e-mail)
app:
  name: ${APP_NAME:TaskForce}
  url: ${APP_URL}
  frontend-url: ${FRONTEND_URL}
  # Base publique du BACKEND (callbacks OAuth). Souvent = APP_URL (même domaine derrière nginx).
  api-url: ${APP_API_URL:${APP_URL}}

# Chiffrement au repos des colonnes sensibles (AES-256-GCM, RGPD C11.2 / C24).
#
# VOLONTAIREMENT SANS VALEUR PAR DÉFAUT : si TF_ENCRYPTION_KEY n'est pas fournie, l'application
# REFUSE de démarrer. Sans cette contrainte, l'absence de clé ne produit aucune erreur — le
# convertisseur devient un passe-plat et les jetons OAuth partent en clair en base, sans log ni
# alerte. Un échec au démarrage est infiniment préférable à un chiffrement silencieusement inactif.
security:
  encryption-key: ${TF_ENCRYPTION_KEY}
  # Défi de vérification humaine à l'inscription. Une valeur par défaut vide est tolérée ici,
  # contrairement à la clé de chiffrement : l'absence de filtre dégrade la protection contre les
  # inscriptions automatisées, elle n'expose pas de donnée. L'état est journalisé au démarrage.
  human-challenge-secret: ${TF_HUMAN_CHALLENGE_SECRET:}

# Intégrations tierces (OAuth) — vides si non configurées
integrations:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
  slack:
    client-id: ${SLACK_CLIENT_ID:}
    client-secret: ${SLACK_CLIENT_SECRET:}

# Logging Configuration
logging:
  level:
    root: WARN
    com.taskforce: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  file:
    name: /var/log/taskforce-api/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  http2:
    enabled: true

# Actuator Production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

