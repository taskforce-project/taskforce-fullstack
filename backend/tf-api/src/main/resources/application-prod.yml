# ===============================
# ENVIRONNEMENT PRODUCTION
# ===============================
spring:
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Production Settings
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  # Flyway Production
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

  # Redis (rate limiting distribué multi-instances — TF-SEC-011)
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  # Security Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM:taskforce}
          jwk-set-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM:taskforce}/protocol/openid-connect/certs
      # Pas de bloc `client` : le client OAuth2 de Spring n'est consommé nulle part (la connexion
      # externe passe par OAuthLoginService, en appels maison lisant `keycloak.*`). Sa présence
      # déclenchait une découverte OIDC au démarrage, incompatible avec un realm à issuer fixe.
  web:
    error:
      include-stacktrace: never
      include-message: always

# Rate limiting distribué (buckets partagés via Redis entre instances) — TF-SEC-011
ratelimit:
  distributed:
    enabled: ${RATELIMIT_DISTRIBUTED_ENABLED:true}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Keycloak Configuration
keycloak:
  url: ${KEYCLOAK_URL}
  # URL publique de Keycloak, celle que suit le navigateur pour la connexion externe. En production
  # c'est auth.<domaine> ; en interne le backend peut joindre Keycloak par un autre nom.
  public-url: ${KEYCLOAK_PUBLIC_URL:${KEYCLOAK_URL}}
  realm: ${KEYCLOAK_REALM:taskforce}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME}
    password: ${KEYCLOAK_ADMIN_PASSWORD}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
  # Endpoints OIDC (dérivés de keycloak.url/realm) — consommés par KeycloakAuthService / OAuthLoginService.
  endpoints:
    token: ${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/token
    logout: ${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/logout
    userinfo: ${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/userinfo
    introspect: ${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/token/introspect
    certs: ${keycloak.url}/realms/${keycloak.realm}/protocol/openid-connect/certs

# Application URLs (OAuth callbacks, liens e-mail)
app:
  name: ${APP_NAME:TaskForce}
  url: ${APP_URL}
  frontend-url: ${FRONTEND_URL}
  # Base publique du BACKEND (callbacks OAuth). Souvent = APP_URL (même domaine derrière nginx).
  api-url: ${APP_API_URL:${APP_URL}}

# ── Blocs ajoutés le 18/08/2026 (1er déploiement VM) : absents du profil prod alors que le code les
#    lit (MailConfig / MinioConfig / StripeConfig / OtpService) → le backend ne DÉMARRAIT PAS sans eux.
#    Valeurs renseignées via .env.prod. ──
# Email transactionnel (OTP, invitations, réinitialisation). Vide = SMTP inactif.
mail:
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:noreply@taskforce.com}
  from-name: ${MAIL_FROM_NAME:TaskForce}
  properties:
    mail:
      smtp:
        auth: ${MAIL_SMTP_AUTH:true}
        starttls:
          enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
      debug: false

# Stockage objet MinIO (S3). `endpoint` = réseau interne ; `public-endpoint` SIGNE les URLs présignées.
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET:taskforce-attachments}

# Paiement Stripe (vide = facturation inactive, l'app démarre quand même).
stripe:
  api-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLIC_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  plans:
    basic:
      price-id: ${STRIPE_PRICE_ID_BASIC:}
    business:
      price-id: ${STRIPE_PRICE_ID_BUSINESS:}
    enterprise:
      price-id: ${STRIPE_ENTERPRISE_PRICE_ID:}
  checkout:
    success-url: ${STRIPE_SUCCESS_URL:${APP_URL}/settings/billing?success=true}
    cancel-url: ${STRIPE_CANCEL_URL:${APP_URL}/settings/billing?canceled=true}

# OTP (codes à usage unique). En prod, l'échec d'envoi BLOQUE l'inscription (pas de fallback log).
otp:
  expiration-minutes: ${OTP_EXPIRATION_MINUTES:15}
  length: ${OTP_LENGTH:6}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  max-requests-per-hour: ${OTP_MAX_REQUESTS_PER_HOUR:5}
  dev-fallback-log: ${OTP_DEV_FALLBACK_LOG:false}

# Chiffrement au repos des colonnes sensibles (AES-256-GCM, RGPD C11.2 / C24).
#
# VOLONTAIREMENT SANS VALEUR PAR DÉFAUT : si TF_ENCRYPTION_KEY n'est pas fournie, l'application
# REFUSE de démarrer. Sans cette contrainte, l'absence de clé ne produit aucune erreur — le
# convertisseur devient un passe-plat et les jetons OAuth partent en clair en base, sans log ni
# alerte. Un échec au démarrage est infiniment préférable à un chiffrement silencieusement inactif.
security:
  encryption-key: ${TF_ENCRYPTION_KEY}
  # Défi de vérification humaine à l'inscription. Une valeur par défaut vide est tolérée ici,
  # contrairement à la clé de chiffrement : l'absence de filtre dégrade la protection contre les
  # inscriptions automatisées, elle n'expose pas de donnée. L'état est journalisé au démarrage.
  human-challenge-secret: ${TF_HUMAN_CHALLENGE_SECRET:}
  # Cloudflare Turnstile. Repli vide toléré, comme le défi signé : l'absence dégrade la protection
  # contre les inscriptions automatisées, elle n'expose aucune donnée. L'état est journalisé au
  # démarrage. ⚠️ Turnstile reçoit l'adresse IP des visiteurs → sous-traitant à inscrire au registre.
  turnstile:
    site-key: ${TF_TURNSTILE_SITE_KEY:}
    secret-key: ${TF_TURNSTILE_SECRET_KEY:}

# Intégrations tierces (OAuth) — vides si non configurées
integrations:
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
  slack:
    client-id: ${SLACK_CLIENT_ID:}
    client-secret: ${SLACK_CLIENT_SECRET:}

# Logging Configuration
logging:
  level:
    root: WARN
    com.taskforce: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  file:
    name: /var/log/taskforce-api/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  http2:
    enabled: true

# Actuator Production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # Ne pas jauger le SMTP dans /health : check flaky, et un mail down ne doit pas rendre l'app "DOWN"
      # (sinon 503 sur /actuator/health → le conteneur passe unhealthy alors que l'app fonctionne).
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

