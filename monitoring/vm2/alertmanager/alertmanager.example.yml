# ============================================================
#  Alertmanager — routage des alertes TaskForce vers Discord.
#
#  DÉPLOIEMENT :
#    1. cp alertmanager/alertmanager.example.yml alertmanager/alertmanager.yml
#    2. Dans Discord : Salon visé → Modifier le salon → Intégrations → Webhooks → Nouveau webhook
#       → nommer (« TaskForce Alertes ») → Copier l'URL du webhook.
#    3. Coller cette URL dans `webhook_url` ci-dessous, DANS alertmanager.yml (gitignoré, jamais versionné).
#
#  alertmanager.example.yml (ce fichier) reste versionné SANS secret ; alertmanager.yml porte l'URL réelle.
# ============================================================
global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: ['alertname', 'severity']
  group_wait: 30s        # laisser 30 s aux alertes simultanées de se regrouper
  group_interval: 5m
  repeat_interval: 4h    # ré-émettre une alerte encore active toutes les 4 h

receivers:
  - name: discord
    discord_configs:
      - webhook_url: 'https://discord.com/api/webhooks/REMPLACER_PAR_TON_WEBHOOK'
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        message: |-
          {{ range .Alerts -}}
          **{{ .Labels.severity | toUpper }}** — {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
