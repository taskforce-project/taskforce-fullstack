name: Runner Tests

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'taskforce-runner/**'
      - 'contracts/**'
      - 'frontend/lib/evidence/**'
      - '.github/workflows/runner-tests.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'taskforce-runner/**'
      - 'contracts/**'
      - 'frontend/lib/evidence/**'
      - '.github/workflows/runner-tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Run Runner Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Le runner lance des processus différemment sous Windows (lanceurs .cmd) : les deux systèmes sont testés.
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: taskforce-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: taskforce-runner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # L'app vérifie un dossier avec le vérificateur du runner (R159, #551), copié sous frontend/lib/evidence par
      # `npm run share:app` : la copie doit être celle de la source, octet pour octet.
      - name: The app's copy of the evidence verifier
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm run share:app
          added=$(git ls-files --others --exclude-standard -- ../frontend/lib/evidence)
          if ! git diff --quiet -- ../frontend/lib/evidence || [ -n "$added" ]; then
            git status --short -- ../frontend/lib/evidence
            echo "::error::frontend/lib/evidence is not the copy of taskforce-runner/src/harness/{verifier,engine}: run npm run share:app in taskforce-runner and commit the result."
            exit 1
          fi
