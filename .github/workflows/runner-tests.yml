name: Runner Tests

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'taskforce-runner/**'
      - '.github/workflows/runner-tests.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'taskforce-runner/**'

permissions:
  contents: read

jobs:
  test:
    name: Run Runner Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Le runner lance des processus différemment sous Windows (lanceurs .cmd) : les deux systèmes sont testés.
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: taskforce-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: taskforce-runner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
