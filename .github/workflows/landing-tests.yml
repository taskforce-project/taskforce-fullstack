name: Landing Page Tests & Quality

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'landing-page/**'
      - '.github/workflows/landing-tests.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'landing-page/**'

jobs:
  test:
    name: Run Landing Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: landing-page

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 🔍 Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: 📝 Run TypeScript compiler check
        run: npm run typecheck

      - name: 🏗️ Build Astro site
        run: npm run build
        env:
          NODE_ENV: production

      - name: 💾 Archive build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-build
          path: landing-page/dist/
          retention-days: 7

  # Job optionnel : Lighthouse CI pour performances
  lighthouse:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    defaults:
      run:
        working-directory: landing-page

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build site
        run: npm run build

      # Ce job n'a JAMAIS rien mesuré jusqu'au 22/07/2026. Trois défauts cumulés :
      #
      #  1. `urls: http://localhost:4321` pointait un serveur que rien ne démarrait. La config
      #     déclarait bien `startServerCommand`, mais `defaults.run.working-directory` ne s'applique
      #     PAS aux étapes `uses:` — l'action tournait donc depuis la racine du dépôt, où le script
      #     `preview` n'existe pas.
      #  2. L'entrée `urls` de l'action supplantait de toute façon l'URL de la config.
      #  3. `continue-on-error: true` avalait l'échec, et un job en erreur tolérée remonte « success ».
      #
      # Corrigé par `staticDistDir` côté `.lighthouserc.json` : LHCI sert lui-même le dossier
      # construit, sans processus serveur ni dépendance au répertoire courant.
      - name: 🚀 Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './landing-page/.lighthouserc.json'
          temporaryPublicStorage: true
          uploadArtifacts: true

  # Job de sécurité (analyse des dépendances)
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: landing-page

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 🔒 Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 📊 Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        continue-on-error: true

