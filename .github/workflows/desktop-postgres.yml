name: Desktop - PostgreSQL bundle

# Builds the PostgreSQL that the desktop app embeds: PostgreSQL 18.4 with pgvector and uuid-ossp, trimmed to what the
# app runs (desktop/postgres/trim.mjs), for Windows and Linux. The migrations create the vector extension, so the app
# cannot start without it. Each job checks the bundle on a fresh cluster before uploading it.

on:
  workflow_dispatch:
  # Called by the desktop release (desktop-release.yml), which packs the bundle into the installers.
  workflow_call:
  push:
    branches: [feature/desktop]
    paths:
      - '.github/workflows/desktop-postgres.yml'
      - 'desktop/postgres/**'

permissions:
  contents: read

env:
  PG_VERSION: '18.4'
  # Build number of the EnterpriseDB binaries archive for Windows.
  EDB_BUILD: '2'
  PGVECTOR_VERSION: 'v0.8.7'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the PostgreSQL binaries
        shell: pwsh
        run: |
          $url = "https://get.enterprisedb.com/postgresql/postgresql-$env:PG_VERSION-$env:EDB_BUILD-windows-x64-binaries.zip"
          Invoke-WebRequest $url -OutFile pg.zip
          Expand-Archive pg.zip -DestinationPath C:\pgdist

      - name: Build pgvector with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          git clone --depth 1 --branch %PGVECTOR_VERSION% https://github.com/pgvector/pgvector.git
          cd pgvector
          set "PGROOT=C:\pgdist\pgsql"
          nmake /NOLOGO /F Makefile.win || exit /b 1
          nmake /NOLOGO /F Makefile.win install || exit /b 1

      - name: Trim the bundle
        run: node desktop/postgres/trim.mjs C:\pgdist\pgsql dist\postgres

      - name: Check the bundle on a fresh cluster
        shell: pwsh
        run: |
          # PostgreSQL drops administrator rights on Windows: its data and log must be writable by a plain user,
          # which the root of C:\ is not.
          $bin = "dist\postgres\bin"
          $data = Join-Path $env:RUNNER_TEMP "pgdata"
          $log = Join-Path $env:RUNNER_TEMP "pg.log"
          & "$bin\initdb.exe" -D $data -U taskforce -A trust -E UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$bin\pg_ctl.exe" -D $data -o "-p 55432 -h 127.0.0.1" -l $log -w start
          if ($LASTEXITCODE -ne 0) { Get-Content $log; exit 1 }
          & "$bin\psql.exe" -h 127.0.0.1 -p 55432 -U taskforce -d postgres -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector; CREATE EXTENSION "uuid-ossp"; SELECT extversion FROM pg_extension WHERE extname = ''vector''; SELECT ''[1,2,3]''::vector <=> ''[1,2,4]''::vector AS cosine_distance;'
          $code = $LASTEXITCODE
          & "$bin\pg_ctl.exe" -D $data -w stop
          exit $code

      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path dist\postgres\* -DestinationPath postgres-${{ env.PG_VERSION }}-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: postgres-windows-x64
          path: postgres-${{ env.PG_VERSION }}-windows-x64.zip
          retention-days: 30

  linux:
    name: Linux x64
    # The oldest supported runner, so the bundle runs on older glibc versions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build PostgreSQL
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq uuid-dev
          curl -fsSLO "https://ftp.postgresql.org/pub/source/v${PG_VERSION}/postgresql-${PG_VERSION}.tar.bz2"
          tar xjf "postgresql-${PG_VERSION}.tar.bz2"
          cd "postgresql-${PG_VERSION}"
          # Relocatable: the tools find their libraries next to them ($ORIGIN), wherever the app is installed. A
          # prefix containing "pgsql" keeps share/ and lib/ flat: otherwise PostgreSQL nests them in postgresql/.
          ./configure --prefix=/opt/pgsql --without-icu --without-readline --with-uuid=e2fs --disable-rpath \
            LDFLAGS='-Wl,-rpath,$$ORIGIN/../lib'
          make -j"$(nproc)" -s
          make -s install
          make -C contrib/uuid-ossp -s install

      - name: Build pgvector
        run: |
          git clone --depth 1 --branch "${PGVECTOR_VERSION}" https://github.com/pgvector/pgvector.git
          cd pgvector
          # No -march=native: the library must run on every x86-64 CPU, not only on the build machine's.
          make OPTFLAGS="" PG_CONFIG=/opt/pgsql/bin/pg_config
          make install PG_CONFIG=/opt/pgsql/bin/pg_config

      - name: Trim the bundle
        run: node desktop/postgres/trim.mjs /opt/pgsql dist/postgres

      - name: Check the bundle on a fresh cluster
        run: |
          # The build folder goes away first: the bundle must run on its own, as on a user's machine.
          sudo mv /opt/pgsql /opt/pgsql.build
          bin=dist/postgres/bin
          "$bin/initdb" -D /tmp/pgdata -U taskforce -A trust -E UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
          "$bin/pg_ctl" -D /tmp/pgdata -o "-p 55432 -h 127.0.0.1" -l /tmp/pg.log -w start || { cat /tmp/pg.log; exit 1; }
          "$bin/psql" -h 127.0.0.1 -p 55432 -U taskforce -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION vector; CREATE EXTENSION "uuid-ossp";' \
            -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';" \
            -c "SELECT '[1,2,3]'::vector <=> '[1,2,4]'::vector AS cosine_distance;"
          "$bin/pg_ctl" -D /tmp/pgdata -w stop

      - name: Pack
        # A tarball keeps the executable bits that the artifact zip would lose.
        run: tar -C dist/postgres -czf "postgres-${PG_VERSION}-linux-x64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: postgres-linux-x64
          path: postgres-${{ env.PG_VERSION }}-linux-x64.tar.gz
          retention-days: 30
