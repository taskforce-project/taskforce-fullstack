name: E2E Tests (Playwright)

# Parcours critiques bout-en-bout : connexion, routes protégées, redistribution (PROD-1.12).
# La stack dev est levée via docker-compose ; Playwright tourne sur le runner (localhost:3000/8080
# mappés). NEXT_PUBLIC_API_URL=http://localhost:8080 fonctionne car, sur le runner, localhost pointe
# vers les ports publiés des conteneurs.
#
# ⚠️ GATE — Ce job a besoin de `backend/tf-api/.env.dev` (secrets/config non versionnés, volontairement).
# Il est donc SKIPPÉ par défaut (statut neutre, pas d'échec rouge) et ne s'exécute que si la variable
# de dépôt `E2E_ENABLED` vaut "true" (Settings → Secrets and variables → Actions → Variables).
# Pour l'activer : définir `E2E_ENABLED=true` ET fournir l'env (ex. secret `E2E_ENV_FILE`, cf. étape
# « Générer .env.dev »). Localement, les tests restent lançables via `npm run e2e`.

on:
  push:
    branches: [main, dev, 'feature/**', 'fix/**', 'test/**']
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.dev.yml'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    # Gate : skip tant que le dépôt n'a pas opté-in (env non versionné requis pour lever la stack).
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 🔐 Générer backend/tf-api/.env.dev depuis le secret
        # L'env n'est pas versionné : on le reconstruit depuis le secret `E2E_ENV_FILE` (opt-in).
        env:
          E2E_ENV_FILE: ${{ secrets.E2E_ENV_FILE }}
        run: |
          if [ -z "$E2E_ENV_FILE" ]; then
            echo "::error::E2E_ENABLED=true mais le secret E2E_ENV_FILE est absent — impossible de lever la stack."
            exit 1
          fi
          printf '%s' "$E2E_ENV_FILE" > backend/tf-api/.env.dev

      - name: 🐳 Lever la stack (dev)
        run: docker compose -f docker-compose.dev.yml --env-file backend/tf-api/.env.dev up -d --build postgres keycloak backend frontend minio rabbitmq

      - name: ⏳ Attendre le backend (santé)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1; then echo "backend up"; break; fi
            sleep 5
          done

      - name: 🌱 Seed de démo
        run: docker exec -i taskforce-postgres-dev psql -U postgres -d taskforce-db < backend/tf-api/seed/dev_seed.sql

      - name: ⏳ Attendre le frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then echo "frontend up"; break; fi
            sleep 5
          done

      - name: 📦 Installer les deps front
        working-directory: frontend
        run: npm ci

      - name: 🎭 Installer Playwright + navigateurs
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 🧪 Lancer les tests E2E
        working-directory: frontend
        run: npm run e2e

      - name: 📤 Rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: 🧹 Logs en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail 100 backend frontend
