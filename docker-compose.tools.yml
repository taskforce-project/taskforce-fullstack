# ===============================
# DOCKER COMPOSE - OUTILS ANALYSE
# ===============================
# Utilisation:
#   # Observabilite (SigNoz)
#   docker compose -f docker-compose.tools.yml --profile observability up -d
#
#   # Scanners de securite (one-shot)
#   docker compose -f docker-compose.tools.yml --profile security run --rm trivy
#   docker compose -f docker-compose.tools.yml --profile security run --rm semgrep
#
# IMPORTANT:
#   Le reseau taskforce-dev-network doit exister pour les services observabilite.
#   Demarrer d'abord la stack app via docker-compose.dev.yml (ou creer le reseau manuellement).
# ===============================

name: taskforce-tools

services:
  # ================================
  # Profil observability (SigNoz)
  # ================================

  signoz-zookeeper:
    image: signoz/zookeeper:3.7.1
    container_name: taskforce-signoz-zookeeper
    user: root
    environment:
      ZOO_SERVER_ID: "1"
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_AUTOPURGE_INTERVAL: "1"
      ZOO_ENABLE_PROMETHEUS_METRICS: "yes"
      ZOO_PROMETHEUS_METRICS_PORT_NUMBER: "9141"
    volumes:
      - signoz_zookeeper_data:/bitnami/zookeeper
    networks:
      - taskforce-network
    profiles:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  signoz-init-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: taskforce-signoz-init-clickhouse
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        target="/var/lib/clickhouse/user_scripts/histogramQuantile"
        if [ -f "$$target" ]; then
          echo "histogramQuantile already present, skipping download."
          exit 0
        fi
        echo "Downloading histogram-quantile for $${node_os}/$${node_arch}..."
        cd /tmp
        wget -q -O histogram-quantile.tar.gz \
          "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz" \
          && tar -xzf histogram-quantile.tar.gz \
          && mv histogram-quantile "$$target" \
          && chmod +x "$$target" \
          && echo "histogramQuantile downloaded successfully." \
          || echo "WARNING: Could not download histogramQuantile (offline?). Histogram metrics may be unavailable."
    volumes:
      - signoz_clickhouse_user_scripts:/var/lib/clickhouse/user_scripts/
    networks:
      - taskforce-network
    profiles:
      - observability
    restart: on-failure

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    container_name: taskforce-signoz-clickhouse
    tty: true
    depends_on:
      signoz-init-clickhouse:
        condition: service_completed_successfully
      signoz-zookeeper:
        condition: service_healthy
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./observability/clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro
      - ./observability/clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
      - ./observability/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro
      - ./observability/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - signoz_clickhouse_user_scripts:/var/lib/clickhouse/user_scripts/
      - signoz_clickhouse_data:/var/lib/clickhouse/
    networks:
      - taskforce-network
    profiles:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:v0.144.3
    container_name: taskforce-signoz-migrator
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    networks:
      - taskforce-network
    profiles:
      - observability
    restart: on-failure

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:v0.144.3
    container_name: taskforce-signoz-otel-collector
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector \
          --config=/etc/otel-collector-config.yaml \
          --manager-config=/etc/manager-config.yaml \
          --copy-path=/var/tmp/collector-config.yaml
    environment:
      OTEL_RESOURCE_ATTRIBUTES: "host.name=signoz-host,os.type=linux"
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: "true"
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./observability/signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - taskforce-network
    profiles:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:13133"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  signoz:
    image: signoz/signoz:v0.120.0
    container_name: taskforce-signoz
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    ports:
      - "3301:8080"
    environment:
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      SIGNOZ_TOKENIZER_JWT_SECRET: "${SIGNOZ_JWT_SECRET:-dev-signoz-secret-change-me}"
    volumes:
      - signoz_sqlite_data:/var/lib/signoz/
    networks:
      - taskforce-network
    profiles:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ================================
  # Profil security (one-shot)
  # ================================

  trivy:
    image: aquasec/trivy:latest
    container_name: taskforce-trivy
    command: ["fs", "--scanners", "vuln,secret,misconfig", "--exit-code", "0", "--format", "table", "/workspace"]
    volumes:
      - .:/workspace:ro
      - trivy_cache:/root/.cache/trivy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    profiles:
      - security
    restart: "no"

  semgrep:
    image: semgrep/semgrep:latest
    container_name: taskforce-semgrep
    command:
      - semgrep
      - scan
      - /src
      - --config
      - auto
      - --config
      - p/secrets
      - --no-git-ignore
      - --text
      - --severity
      - WARNING
    volumes:
      - .:/src:ro
    profiles:
      - security
    restart: "no"

volumes:
  signoz_zookeeper_data:
    driver: local
    name: signoz-zookeeper-1
  signoz_clickhouse_data:
    driver: local
    name: signoz-clickhouse
  signoz_clickhouse_user_scripts:
    driver: local
    name: signoz-clickhouse-user-scripts
  signoz_sqlite_data:
    driver: local
    name: signoz-sqlite
  trivy_cache:
    driver: local

networks:
  taskforce-network:
    external: true
    name: taskforce-dev-network
