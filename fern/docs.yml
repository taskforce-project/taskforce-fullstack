# Documentation TaskForce (Fern) — doc PRODUIT (guides) + RÉFÉRENCE API au même endroit.
# Publier : `fern login` puis `fern generate --docs` (voir fern/README.md).

instances:
  - url: taskforce.docs.buildwithfern.com
    custom-domain: docs.taskforce-project.fr

title: TaskForce Docs
favicon: ./assets/favicon.svg

logo:
  light: ./assets/logo-light.svg
  dark: ./assets/logo-dark.svg
  height: 26
  href: https://taskforce-project.fr

# Palette de marque TaskForce, reprise 1:1 des design tokens de l'app (frontend/app/globals.css,
# palette « Cloudflare-flat »). On ne peut pas injecter le globals.css tel quel (Fern n'est pas
# Tailwind/shadcn) : on mappe donc les primitives de marque sur les couleurs natives de Fern.
# Police : l'app utilise Inter, qui est aussi la police par defaut de Fern -> deja aligne.
colors:
  accent-primary:
    light: "#2563eb"   # --primary (blue-600)
    dark: "#3b82f6"    # --primary dark (blue-500)
  background:
    light: "#fbfbfc"   # --background
    dark: "#0b0b0c"
  sidebar-background:
    light: "#fbfbfc"   # --sidebar (= background, pas de rupture, facon Cloudflare)
    dark: "#0b0b0c"
  header-background:
    light: "#fbfbfc"
    dark: "#0b0b0c"
  card-background:
    light: "#ffffff"   # --card
    dark: "#161617"
  border:
    light: "#e6e6e9"   # --border
    dark: "#2a2a2c"

navbar-links:
  - type: minimal
    text: Ouvrir l'app
    url: https://app.taskforce-project.fr
  - type: github
    value: https://github.com/taskforce-project

tabs:
  guides:
    display-name: Guides
    icon: "fa-solid fa-book-open"
  api:
    display-name: Référence API
    icon: "fa-solid fa-code"

navigation:
  - tab: guides
    layout:
      - section: Découvrir
        skip-slug: true
        contents:
          - page: Bienvenue
            path: ./pages/index.md
            slug: bienvenue
          - page: Concepts clés
            path: ./pages/concepts-cles.md
            slug: concepts-cles
          - page: Premiers pas
            path: ./pages/premiers-pas.md
            slug: premiers-pas
      - section: Organiser le travail
        skip-slug: true
        contents:
          - page: Espaces & projets
            path: ./pages/espaces-et-projets.md
            slug: espaces-et-projets
          - page: Issues & tableaux
            path: ./pages/issues-et-tableaux.md
            slug: issues-et-tableaux
          - page: Cycles
            path: ./pages/cycles.md
            slug: cycles
      - section: Collaborer
        skip-slug: true
        contents:
          - page: Membres & rôles
            path: ./pages/membres-et-roles.md
            slug: membres-et-roles
          - page: Inviter son équipe
            path: ./pages/inviter-son-equipe.md
            slug: inviter-son-equipe
          - page: Smart Assign
            path: ./pages/smart-assign.md
            slug: smart-assign
      - section: Aller plus loin
        skip-slug: true
        contents:
          - page: Mémoire (Brain OS)
            path: ./pages/memoire.md
            slug: memoire
          - page: Analytics
            path: ./pages/analytics.md
            slug: analytics
          - page: Intégrations
            path: ./pages/integrations.md
            slug: integrations
      - section: Compte
        skip-slug: true
        contents:
          - page: Offres & IA
            path: ./pages/offres-et-ia.md
            slug: offres-et-ia
  - tab: api
    layout:
      - api: Référence API
