# Documentation TaskForce (Fern) — doc PRODUIT (guides) + RÉFÉRENCE API au même endroit.
# Publier : `fern login` puis `fern generate --docs` (voir fern/README.md).

instances:
  - url: taskforce.docs.buildwithfern.com
    custom-domain: docs.taskforce-project.fr

title: TaskForce Docs
favicon: ./assets/favicon.svg

logo:
  light: ./assets/logo.svg
  dark: ./assets/logo.svg
  height: 28
  href: https://taskforce-project.fr

# Bleu de marque TaskForce (miroir de --primary de la landing).
colors:
  accent-primary:
    light: "#2563eb"
    dark: "#3b82f6"

navbar-links:
  - type: minimal
    text: Ouvrir l'app
    url: https://app.taskforce-project.fr
  - type: github
    value: https://github.com/taskforce-project

tabs:
  guides:
    display-name: Guides
    icon: "fa-solid fa-book-open"
  api:
    display-name: Référence API
    icon: "fa-solid fa-code"

navigation:
  - tab: guides
    layout:
      - section: Découvrir
        contents:
          - page: Bienvenue
            path: ./pages/index.md
          - page: Premiers pas
            path: ./pages/premiers-pas.md
      - section: Guides produit
        contents:
          - page: Espaces & projets
            path: ./pages/espaces-et-projets.md
          - page: Inviter son équipe
            path: ./pages/inviter-son-equipe.md
  - tab: api
    layout:
      - api: Référence API
