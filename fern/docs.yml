# TaskForce documentation (Fern): guides and API reference on docs.taskforce-project.fr.
# Publishing: see fern/README.md.

instances:
  - url: taskforce.docs.buildwithfern.com
    custom-domain: docs.taskforce-project.fr

title: TaskForce Docs
favicon: ./assets/favicon.svg

logo:
  light: ./assets/logo-light.svg
  dark: ./assets/logo-dark.svg
  height: 26
  href: https://taskforce-project.fr

# Brand colors, taken from the app's design tokens (frontend/app/globals.css).
colors:
  accent-primary:
    light: "#2563eb"
    dark: "#3b82f6"
  background:
    light: "#fbfbfc"
    dark: "#0b0b0c"
  sidebar-background:
    light: "#fbfbfc"
    dark: "#0b0b0c"
  header-background:
    light: "#fbfbfc"
    dark: "#0b0b0c"
  card-background:
    light: "#ffffff"
    dark: "#161617"
  border:
    light: "#e6e6e9"
    dark: "#2a2a2c"

navbar-links:
  - type: github
    value: https://github.com/taskforce-project/taskforce-fullstack

tabs:
  guides:
    display-name: Guides
    icon: "fa-solid fa-book-open"
    slug: guides
  api:
    display-name: API
    icon: "fa-solid fa-code"
    slug: api

navigation:
  - tab: guides
    layout:
      - section: Get started
        skip-slug: true
        contents:
          - page: Welcome
            path: ./pages/welcome.md
            slug: welcome
          - page: Self-hosting
            path: ./pages/self-hosting.md
            slug: self-hosting
          - page: Concepts
            path: ./pages/concepts.md
            slug: concepts
      - section: Features
        skip-slug: true
        contents:
          - page: Coding agents
            path: ./pages/coding-agents.md
            slug: coding-agents
          - page: AI
            path: ./pages/ai.md
            slug: ai
          - page: Integrations
            path: ./pages/integrations.md
            slug: integrations
  - tab: api
    layout:
      - section: Guides
        skip-slug: true
        contents:
          - page: Introduction
            path: ./pages/api-introduction.md
            slug: api-introduction
          - page: Authentication
            path: ./pages/api-authentication.md
            slug: api-authentication
          - page: Conventions
            path: ./pages/api-conventions.md
            slug: api-conventions
          - page: Webhooks
            path: ./pages/api-webhooks.md
            slug: api-webhooks
          - page: MCP server
            path: ./pages/api-mcp.md
            slug: api-mcp
      - api: API reference
        slug: api-reference

# Addresses of the former French guides (until October 2026).
redirects:
  - source: /guides/bienvenue
    destination: /guides/welcome
  - source: /guides/premiers-pas
    destination: /guides/self-hosting
  - source: /guides/concepts-cles
    destination: /guides/concepts
  - source: /guides/memoire
    destination: /guides/concepts
  - source: /guides/smart-assign
    destination: /guides/concepts
  - source: /guides/ia-vue-ensemble
    destination: /guides/ai
  - source: /guides/ia-assistant
    destination: /guides/ai
  - source: /reference-api/api-introduction
    destination: /api/api-introduction
  - source: /reference-api/api-authentification
    destination: /api/api-authentication
  - source: /reference-api/api-conventions
    destination: /api/api-conventions
  - source: /reference-api/api-mcp
    destination: /api/api-mcp
